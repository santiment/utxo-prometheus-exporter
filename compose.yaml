services:
  bitcoind:
    # DO NOT USE THIS IMAGE EXCEPT FOR TESTING!
    image: jvstein/bitcoin-test-node:latest
    command:
      - bitcoind
      - -printtoconsole
      - -conf=/etc/bitcoin/bitcoin.conf
    volumes:
      - ./test-bitcoin.conf:/etc/bitcoin/bitcoin.conf

  exporter:
    image: santiment/utxo-prometheus-exporter:latest
    build: .
    ports:
      - "9332:9332"
    environment:
      UTXO_NODE_RPC_HOST: bitcoind
      UTXO_NODE_RPC_USER: "alice"
      UTXO_NODE_RPC_PASSWORD: "password=123/&z!=@e"
      #UTXO_NODE_CONF_PATH: /etc/bitcoin/bitcoin.conf
      LOG_LEVEL: "INFO"
    depends_on:
      - bitcoind
    #volumes:
    # For explicit config file path (with UTXO_NODE_CONF_PATH above).
    # - ./test-bitcoin.conf:/etc/bitcoin/bitcoin.conf
    # For default bitcoin config location (nobody user).
    # - ./test-bitcoin.conf:/.bitcoin/bitcoin.conf
